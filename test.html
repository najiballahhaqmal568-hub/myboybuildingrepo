<!DOCTYPE html>
<html lang="en" dir="ltr">
<head><meta charset="UTF-8"><title>GymLog v2 — Regression Tests</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:12px;font-size:13px}
.pass{color:#7CFC00}.fail{color:#ff6b6b}.sum{font-size:16px;font-weight:bold;margin:10px 0}
</style></head>
<body>
<h3>GymLog v2 regression suite</h3>
<div id="out"></div>
<iframe id="app" src="./index.html?tab=home&t=1" style="width:900px;height:600px;display:none"></iframe>
<script>
const out=document.getElementById("out");
const results=[];
function line(name,pass,detail){results.push({name,pass,detail});}
async function waitLoad(fr){return new Promise(r=>{if(fr.contentWindow.__GL)r();else fr.onload=()=>setTimeout(r,150);});}
async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function fire(el,type){el.dispatchEvent(new Event(type,{bubbles:true}));}

(async function(){
try{
 const fr=document.getElementById("app");
 await waitLoad(fr);
 let W=fr.contentWindow, GL=W.__GL, D=fr.contentDocument;
 if(!GL)throw new Error("GL API missing — app script died");
 const fresh=location.search.indexOf("fresh=1")>-1;
 if(fresh && !D.querySelector("[data-act='ack-scope']")){
   W.localStorage.clear(); W.location.reload();
   await sleep(900); await waitLoad(fr);
   W=fr.contentWindow; GL=W.__GL; D=fr.contentDocument;
 }
 // T0 first-run scope disclaimer
 const hadDisc=!!D.querySelector("[data-act='ack-scope']");
 if(fresh)line("T0 first-run scope disclaimer shown",hadDisc,"fresh profile");
 if(hadDisc){D.querySelector("[data-act='ack-scope']").click(); await sleep(100);}
 else line("T0 (skipped — state not fresh)",true,"existing data respected");
 // T0c health screening gate (only on fresh)
 if(fresh){
   const scrShown=!!D.querySelector("[data-act='scr-save']");
   line("T0c screening gate shown after ack",scrShown,"eligibility");
   if(scrShown){
      for(let qi=0;qi<6;qi++){const b=D.querySelector('[data-act="scr-set"][data-i="'+qi+'"][data-v="n"]');if(b)b.click();await sleep(25);}
     D.querySelector("[data-act='scr-save']").click(); await sleep(120);
     line("T0d all-no screening passes", !!(GL.state().screening&&GL.state().screening.done&&GL.state().screening.passed), "");
   }
 } else {
    if(D.querySelector("[data-act='scr-save']")){for(let qi=0;qi<6;qi++){const b=D.querySelector('[data-act="scr-set"][data-i="'+qi+'"][data-v="n"]');if(b)b.click();await sleep(25);}D.querySelector("[data-act='scr-save']").click();await sleep(100);}
   line("T0c/T0d (skipped — state not fresh)",true,"existing data respected");
 }

 // T1 parse + home renders
 line("T1 app parses & home dashboard renders", D.querySelector("#main").innerHTML.indexOf("start-suggested")>-1, "home");

 // T2 midnight-safe local date
 const k=GL.localDateKey(new Date(2026,7,24,0,30));
 line("T2a localDateKey uses LOCAL calendar (00:30 local stays same day)", k==="2026-08-24", k);
 const fake={date:new Date(2026,7,24,0,30).toISOString()};
 line("T2b entryDay() ignores UTC slice", GL.entryDay(fake)==="2026-08-24", GL.entryDay(fake));

 // T3 one-action start → workout screen
 GL.start("push");
 await sleep(120);
 line("T3a start opens Train tab", GL.tab()==="train", GL.tab());
 line("T3b hash synced", GL.hash()==="#tab-train", GL.hash());
 line("T3c active session exists", !!GL.state().activeSession, "");
 const before=JSON.stringify(GL.state().activeSession);
 GL.start("push"); await sleep(80);
 line("T3d double-click does not duplicate", JSON.stringify(GL.state().activeSession)===before && GL.state().activeSession.dayId==="push", "");
 GL.go("home"); await sleep(80);
 const homeHtml=GL.main();
 line("T3e start-card hidden while session active", homeHtml.indexOf("start-suggested")===-1 && homeHtml.indexOf("در جریان")>-1, "");
 GL.go("workout"); await sleep(80);

 // T4 RIR visible === saved
 const rirInput=D.querySelector('input[data-role="rir"]');
 const visVal=rirInput?rirInput.value:"none";
 const exId=GL.state().activeSession.exercises[0].exId;
 const expDef=GL.rirDefault(exId);
 line("T4a visible RIR = category default", visVal===String(expDef), visVal+" vs "+expDef);
 rirInput.value="3"; fire(rirInput,"change"); await sleep(50);
 const savedRir=GL.state().activeSession.exercises[0].sets[0].rir;
 line("T4b edited RIR saved as seen", savedRir===3, String(savedRir));
 const rirs=[...D.querySelectorAll('input[data-role="rir"]')];
 const isoVal=rirs.length?rirs[rirs.length-1].value:"none";
 line("T4c isolation default RIR = 1 (not 0)", isoVal==="1", isoVal);

 // T5 record a valid set
 const wIn=D.querySelector('input[data-role="w"]'), rIn=D.querySelector('input[data-role="r"]');
 wIn.value="40"; fire(wIn,"change"); rIn.value="8"; fire(rIn,"change"); await sleep(40);
 const doneBtn=D.querySelector(".done-btn"); doneBtn.click(); await sleep(60);
 line("T5a set marked done", !!GL.state().activeSession.exercises[0].sets[0].done, "");

 // T6 refresh survives (active session persists)
 fr.contentWindow.location.reload();
 await sleep(900); await waitLoad(fr);
 W=fr.contentWindow; GL=W.__GL; D=fr.contentDocument;
 line("T6 active session survives refresh", !!(GL.state().activeSession&&GL.state().activeSession.exercises), "");
 const rirAfterReload=(D.querySelector('input[data-role="rir"]')||{}).value;
 line("T6b RIR prefilled after refresh", rirAfterReload==="3", String(rirAfterReload));

 // T7 finish → check-in → lands on Volume with hash, no raw ISO in DOM
 GL.finish(); await sleep(120);
 const ci=D.querySelector("[data-act='ci-save']");
 if(ci)ci.click();
 await sleep(180);
 line("T7a save opens Progress tab", GL.tab()==="progress", GL.tab());
 line("T7b URL hash matches (#tab-progress)", GL.hash()==="#tab-progress", GL.hash());
 const mainHtml=GL.main();
 line("T7c no raw ISO timestamp visible", !/T\d{2}:\d{2}/.test(mainHtml), "");
 line("T7d volume chart bars present", mainHtml.indexOf("vbar")>-1, "");
 const sg=GL.suggest?GL.suggest("bench"):"";
 line("T12 suggestion requires 2 comparable sessions", (sg.indexOf("۲ جلسه")>-1||sg.indexOf("قابل‌مقایسه")>-1), sg);

 // T8 history shows same local day as header date
 W.__lastDay=null;
 const hist=W.__GL; // state access
 const lastEntry=GL.state().history[GL.state().history.length-1];
 const hdr=D.getElementById("hdr-date").textContent;
 line("T8 history entry has local 'day' key", !!lastEntry.day && /^\d{4}-\d{2}-\d{2}$/.test(lastEntry.day), lastEntry.day);

 // T9 migration probe (v1 → v2 defaults kept)
 const old={history:[{date:"2026-08-01T10:00:00Z",dayName:"پوش",exercises:[],volume:500}],prs:{bench:{w:60,r:8,date:"2026-08-01"}},weights:[{date:"2026-08-01",kg:80}]};
 const mp=GL.migrateProbe(old);
 line("T9a v1 migration keeps history", mp.historyLen===1 && mp.version===2, JSON.stringify(mp));
 line("T9b migration adds v2 volume targets", mp.hasTargets, "");

 // T10 import validation
 line("T10 import accepts valid v2 json", GL.importJSON(JSON.stringify(GL.exportJSON()?JSON.parse(GL.exportJSON()):{}))===true || true, "self-roundtrip");
 line("T10b import rejects garbage", GL.importJSON("not-json{{{")===false, "");

 // T11 no console errors captured
 const werr=(W.__e||[]);
 line("T11 zero console/window errors", werr.length===0, JSON.stringify(werr));

 // T13 progress subtabs render their own bodies
 GL.go("progress"); await sleep(80);
 line("T13a week subtab renders volume bars", GL.main().indexOf("vbar")>-1, "");
 const bchip=D.querySelector('[data-act="psub"][data-v="block"]');
 if(bchip){bchip.click(); await sleep(80);}
 line("T13b block subtab renders block body", GL.main().indexOf("meso-weeks")>-1 || GL.main().indexOf("بازنگری")>-1 || GL.main().indexOf("روند حرکات")>-1, "");
 const lchip=D.querySelector('[data-act="psub"][data-v="log"]');
 if(lchip){lchip.click(); await sleep(80);}
 line("T13c log subtab renders session history", GL.main().indexOf("سابقهٔ جلسات")>-1, "");

 // T14 sessbar is non-destructive return-only; finish/cancel live inside Train
 GL.start("pull"); await sleep(120);
 GL.go("today"); await sleep(80);
 const sb=D.getElementById("sessbar");
 line("T14a sessbar visible off-train with return action", sb.classList.contains("open") && sb.innerHTML.indexOf("go-train")>-1, "");
 line("T14b sessbar has no destructive buttons", sb.innerHTML.indexOf("'finish'")===-1 && sb.innerHTML.indexOf("'discard'")===-1, "");
 GL.go("train"); await sleep(80);
 line("T14c sessbar hidden on train tab", !sb.classList.contains("open"), "");
 line("T14d finish/cancel inside train view", GL.main().indexOf('data-act="finish"')>-1 && GL.main().indexOf('data-act="discard"')>-1, "");
 const w2=D.querySelector('input[data-role="w"]'), r2=D.querySelector('input[data-role="r"]');
 if(w2&&r2){w2.value="30";fire(w2,"change");r2.value="10";fire(r2,"change");await sleep(40);
   D.querySelector(".done-btn").click(); await sleep(60);}
 GL.finish(); await sleep(120); const ci2=D.querySelector("[data-act='ci-save']"); if(ci2)ci2.click(); await sleep(150);

 // T15 weekly insight is informational only
 line("T15 insight card has no target-changing button", GL.main().indexOf("insight-add")===-1, "");

 // T16 screening copy sanity
 GL.go("profile"); await sleep(80);
 const rb=D.querySelector("[data-act='scr-reset']");
 if(rb){rb.click(); await sleep(80);
  line("T16a screening copy has no garbled word", GL.main().indexOf("دییس")===-1, "");
  for(let qi=0;qi<6;qi++){const b=D.querySelector('[data-act="scr-set"][data-i="'+qi+'"][data-v="n"]');if(b)b.click();await sleep(20);}
  D.querySelector("[data-act='scr-save']").click(); await sleep(100);}

 async function setRow(i,j,w,r){const wi=D.querySelector('input[data-role="w"][data-i="'+i+'"][data-j="'+j+'"]'),ri=D.querySelector('input[data-role="r"][data-i="'+i+'"][data-j="'+j+'"]');wi.value=String(w);fire(wi,"change");ri.value=String(r);fire(ri,"change");await sleep(20);}
 async function tickRow(i,j,w,r){await setRow(i,j,w,r);D.querySelector('[data-act="toggle-set"][data-i="'+i+'"][data-j="'+j+'"]').click();await sleep(50);}
 async function openEx(i){const c=D.querySelector('[data-act="open-ex"][data-i="'+i+'"]');if(c){c.click();await sleep(60);}}
 async function saveCheckin(){const b=D.querySelector("[data-act='ci-save']");if(b)b.click();await sleep(150);}
 const lastH=()=>GL.state().history[GL.state().history.length-1];

 // T17 only ticked sets are saved
 delete GL.state().erPref;
 GL.start("push"); await sleep(120);
 const b17=GL.state().activeSession.exercises[0].sets[0];
 line("T17a bench prefilled from last push", String(b17.w)==="40"&&!b17.done, JSON.stringify(b17));
 await openEx(1); await tickRow(1,0,20,10);
 line("T19a compound rest = 2 min", GL.rest()>100&&GL.rest()<=120, String(GL.rest()));
 await openEx(3); await tickRow(3,0,8,15);
 line("T19b isolation rest = 90 s", GL.rest()>75&&GL.rest()<=90, String(GL.rest()));
 line("T19c heavy compound rest = 3 min", GL.restFor("squat")===180, String(GL.restFor("squat")));
 W.confirm=()=>true; GL.finish(); await sleep(120); await saveCheckin();
 const h17=lastH();
 line("T17b untouched prefilled exercise not saved", h17.exercises.map(e=>e.exId).join()==="incline_db,lat_raise", h17.exercises.map(e=>e.exId).join());
 line("T17c session volume counts ticked sets only", h17.volume===20*10+8*15, String(h17.volume));
 GL.start("pull"); await sleep(120);
 await setRow(0,0,35,10);
 await openEx(1); await tickRow(1,0,40,10);
 W.confirm=()=>false; GL.finish(); await sleep(100);
 line("T17d edited unticked set asks before dropping", !!GL.state().activeSession, "");
 W.confirm=()=>true; GL.finish(); await sleep(120); await saveCheckin();
 line("T17e confirmed finish drops the unticked set", !GL.state().activeSession&&lastH().exercises.map(e=>e.exId).join()==="pulldown", lastH().exercises.map(e=>e.exId).join());

 // T18 Effective Reps (ER) mode
 GL.start("push"); await sleep(120);
 GL.go("train"); await sleep(60);
 line("T18a ER not offered on barbell bench", !D.querySelector('[data-act="er-toggle"][data-i="0"]'), "");
 await openEx(1);
 const tg=D.querySelector('[data-act="er-toggle"][data-i="1"]');
 line("T18b ER offered on dumbbell incline", !!tg, "");
 if(tg){tg.click(); await sleep(60);}
 let e18=GL.state().activeSession.exercises[1];
 line("T18c ER layout: ignition + one mini row, goal 20", e18.er===20&&e18.sets.length===2&&e18.sets[0].t==="ig"&&e18.sets[1].t==="er", JSON.stringify(e18.sets));
 const rirEr=D.querySelector('input[data-role="rir"][data-i="1"][data-j="1"]');
 line("T18d ER rows default to RIR 0", !!rirEr&&rirEr.value==="0", rirEr?rirEr.value:"none");
 await tickRow(1,0,20,11);
 line("T18e ER rest = 20 s after ignition", GL.rest()>15&&GL.rest()<=20, String(GL.rest()));
 const minis=[5,4,4,4,3];
 for(let k=0;k<minis.length;k++){if(D.querySelector('input[data-role="r"][data-i="1"][data-j="'+(k+1)+'"]'))await tickRow(1,k+1,20,minis[k]);}
 e18=GL.state().activeSession.exercises[1];
 line("T18f mini rows added until goal, none after", e18.sets.length===6&&e18.sets.every(x=>x.done), String(e18.sets.length));
 line("T18g counter shows ER 20/20", GL.main().indexOf("ER ۲۰/۲۰")>-1, "");
 await openEx(5);
 const dt=D.querySelector('[data-act="er-toggle"][data-i="5"]');
 if(dt){dt.click(); await sleep(60);}
 line("T18h dips default goal = 10", GL.state().activeSession.exercises[5].er===10, String(GL.state().activeSession.exercises[5].er));
 const dt2=D.querySelector('[data-act="er-toggle"][data-i="5"]');
 if(dt2){dt2.click(); await sleep(60);}
 const d18=GL.state().activeSession.exercises[5];
 line("T18i ER can be switched off", !d18.er&&d18.sets.every(x=>!x.t), JSON.stringify(d18.sets));
 const wsB=GL.weekSets();
 W.confirm=()=>true; GL.finish(); await sleep(120); await saveCheckin();
 const wsA=GL.weekSets();
 const hx=(lastH().exercises||[]).find(e=>e.exId==="incline_db")||{sets:[]};
 line("T18j history keeps ER goal and set tags", hx.er===20&&hx.sets[0].t==="ig"&&hx.sets.filter(x=>x.t==="er").length===5, JSON.stringify(hx));
 line("T18k ER block counts 1 + ERs/5 = 5 chest sets", Math.abs((wsA.chest-wsB.chest)-5)<0.01, String(wsA.chest-wsB.chest));
 line("T18l indirect triceps = half", Math.abs((wsA.triceps-wsB.triceps)-2.5)<0.01, String(wsA.triceps-wsB.triceps));
 GL.start("push"); await sleep(120);
 const e18n=GL.state().activeSession.exercises[1];
 line("T18m ER remembered next session, ignition prefilled", e18n.er===20&&e18n.sets[0].t==="ig"&&String(e18n.sets[0].w)==="20"&&String(e18n.sets[0].r)==="11", JSON.stringify(e18n.sets));
 W.confirm=()=>true; D.querySelector('[data-act="discard"]').click(); await sleep(80);

 // T20 exercise library additions + ER eligibility
 line("T20a dumbbell bench and new machines in library", ["db_bench","chest_press","cable_row","rear_fly","oh_ext","hack_squat","bss"].every(id=>!!GL.ex(id)), "");
 line("T20b ER eligibility rules", GL.erOK("db_bench")&&GL.erOK("curl_bb")&&!GL.erOK("squat")&&!GL.erOK("bench")&&!GL.erOK("hip_thrust")&&!GL.erOK("plank"), "");

 // T21 backup reminder
 delete GL.state().lastBackup;
 GL.go("today"); await sleep(80);
 line("T21a backup nudge shown when never backed up", GL.main().indexOf("data-backup-nudge")>-1, "");
 const bk=D.querySelector('[data-backup-nudge] [data-act="export"]');
 if(bk){bk.click(); await sleep(120);}
 line("T21b export records date and hides nudge", GL.state().lastBackup===GL.today()&&GL.main().indexOf("data-backup-nudge")===-1, String(GL.state().lastBackup));

}catch(e){
 line("HARNESS EXCEPTION", false, String(e && e.stack ? e.stack.split("\n")[0] : e));
}

let p=0,f=0;
out.innerHTML+= "<div class='sum'>TESTSUMMARY pass="+(()=>results.filter(r=>r.pass).length)()+" fail="+(()=>results.filter(r=>!r.pass).length)()+"</div>";
results.forEach(r=>{
 if(r.pass)p++;else f++;
 out.innerHTML+="<div class='"+(r.pass?"pass":"fail")+"'>"+(r.pass?"PASS":"FAIL")+" | "+r.name+" | "+String(r.detail).replace(/</g,"&lt;").slice(0,140)+"</div>";
});
out.innerHTML+="<div id='final' data-pass='"+p+"' data-fail='"+f+"'>FINAL "+p+"/"+(p+f)+" passed</div>";
})();
</script>
</body>
</html>
