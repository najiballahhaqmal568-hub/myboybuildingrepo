<!DOCTYPE html>
<html lang="fa-AF" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>جیم‌لاگ ۲ — نسخه علمی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1d212b;--line:#262b37;--txt:#e7e9ee;--mut:#8b93a3;--acc:#a3e635;--acc-dim:#84cc16;--red:#f87171;--blue:#60a5fa;--amber:#fbbf24;color-scheme:dark}
#nav button:disabled{opacity:.35;pointer-events:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:80px;font-size:15px;line-height:1.6}
input,select,button{font-family:inherit;font-size:inherit;color:inherit}
input[type=number],input[type=text]{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus{border-color:var(--acc)}
h2{font-size:17px;font-weight:800;margin-bottom:12px}
.mut{color:var(--mut);font-size:12.5px}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px}
header .logo{width:34px;height:34px;border-radius:10px;background:var(--acc);color:#0f1115;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
header h1{font-size:16.5px;font-weight:800}
main{max-width:560px;margin:0 auto;padding:14px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{background:var(--acc);color:#0f1115;border:none;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;width:100%}
.btn:active{opacity:.85}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.sm{width:auto;padding:7px 13px;font-size:13px;border-radius:10px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--acc);color:#0f1115;border-color:var(--acc);font-weight:700}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.bar{height:9px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.bar.blue>i{background:var(--blue)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(23,26,33,.97);border-top:1px solid var(--line);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:6px 2px calc(8px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
nav button{background:none;border:none;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;flex:1;padding:5px 0}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);font-weight:700}
.stat{flex:1;text-align:center;background:var(--card2);border-radius:12px;padding:10px 6px}
.stat b{font-size:18px;color:var(--acc)}
.stat span{display:block;font-size:11px;color:var(--mut)}
table.sets{width:100%;border-collapse:collapse;font-size:13.5px}
table.sets th{color:var(--mut);font-weight:500;font-size:11px;padding:4px;text-align:center}
table.sets td{padding:4px}
table.sets input{width:100%;text-align:center;padding:8px 2px;border-radius:9px}
.done-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);color:var(--mut);cursor:pointer;font-size:15px;line-height:1}
.done-btn.did{background:var(--acc);border-color:var(--acc);color:#0f1115;font-weight:900}
.setdone td{opacity:.55}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:none;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.grabber{width:42px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 14px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}
.li b{font-weight:600;font-size:14px}
.timerbar{position:fixed;bottom:76px;left:12px;right:12px;max-width:536px;margin:0 auto;z-index:35;background:var(--card2);border:1px solid var(--acc);border-radius:16px;padding:10px 14px;display:none}
.timerbar.open{display:block}
.timerbar b{font-size:24px;color:var(--acc);font-variant-numeric:tabular-nums}
.vbar{margin:7px 0}
.vbar .spread{margin-bottom:3px;font-size:13px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-90px);z-index:60;background:var(--acc);color:#0f1115;font-weight:800;border-radius:12px;padding:10px 20px;transition:transform .3s;font-size:14px;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.pr{color:var(--amber);font-weight:800;font-size:11.5px}
.empty{text-align:center;color:var(--mut);padding:24px 10px;font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flag-up{color:var(--acc)}
.flag-flat{color:var(--blue)}
.flag-down{color:var(--amber)}
.pain{color:var(--red)}
</style>
</head>

<header>

  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span>تنظیمات</span></button>
</nav>
<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

  inner+=seg(j[1][0],j[1][1],j[2][0],j[2][1])+seg(j[2][0],j[2][1],j[3][0],j[3][1]);
  inner+=seg(j[4][0],j[4][1],j[5][0],j[5][1])+seg(j[5][0],j[5][1],j[6][0],j[6][1]);
  [1,2,3,4,5,6].forEach(i=>inner+=`<circle cx="${j[i][0]}" cy="${j[i][1]}" r="2.6" fill="#a3e635"/>`);
  const pat=svg.dataset.prop;
  if(pat==="bar")inner+=`<line x1="${j[3][0]-16}" y1="${j[3][1]-3}" x2="${j[3][0]+16}" y2="${j[3][1]-3}" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/>`;
  if(pat==="db")inner+=`<circle cx="${j[3][0]}" cy="${j[3][1]+4}" r="4.5" fill="#a3e635"/>`;
  if(pat==="bars")inner+=`<line x1="40" y1="30" x2="40" y2="100" stroke="#262b37" stroke-width="4"/><line x1="80" y1="30" x2="80" y2="100" stroke="#262b37" stroke-width="4"/>`;
  svg.innerHTML=inner;
}
function startAnim(svg){
  stopAnim();
  const pat=PATTERNS[svg.dataset.pattern];if(!pat)return;
  svg.dataset.prop=pat.prop||"";
  const A=pat.a,B=pat.b,t0=performance.now(),dur=1600;
  const tick=now=>{
    const ph=(Math.sin((now-t0)/dur*Math.PI*2)+1)/2;
    const P=A.map((v,i)=>Math.round((v+(B[i]-v)*ph)*10)/10);
    drawPose(svg,P);
    animRAF=requestAnimationFrame(tick);
  };
  animRAF=requestAnimationFrame(tick);
}
function stopAnim(){if(animRAF){cancelAnimationFrame(animRAF);animRAF=null;}}

const $esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function today(d){const x=d?new Date(d):new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function fmtDate(iso){try{return new Date(iso+"T00:00:00").toLocaleDateString("fa-AF",{weekday:"long",day:"numeric",month:"long"});}catch(e){return iso;}}
function localDateKey(v){const x=(v instanceof Date)?v:new Date(v);if(isNaN(x.getTime()))return today();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function entryDay(h){return h.day||localDateKey(h.date);}
function faNum(n){return String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);}
function faDateShort(key){try{return new Date(key+"T00:00:00").toLocaleDateString("fa-AF",{day:"numeric",month:"short"});}catch(e){return key;}}
function daysAgoKey(n){const d=new Date();d.setDate(d.getDate()-n);return localDateKey(d);}
function setTab(t){ui.tab=t;try{location.hash="tab-"+t;}catch(e){}window.scrollTo(0,0);render();}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),2400);}
function exById(id){return LIB.find(e=>e.id===id);}
function e1rm(w,r){return w*Math.max(1,1+r/30);}
function volOf(wsess){let v=0;(wsess.exercises||[]).forEach(e=>(e.sets||[]).forEach(s=>{if(s.w&&s.r)v+=s.w*s.r;}));return Math.round(v);}

function streak(){
  const done=new Set(S.history.map(h=>entryDay(h)));
  let n=0;const d=new Date();
  if(!done.has(today()))d.setDate(d.getDate()-1);
  while(done.has(today(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function lastSetsFor(exId){
  for(let i=S.history.length-1;i>=0;i--){
    const w=(S.history[i].exercises||[]).find(e=>e.exId===exId);
    if(w&&w.sets.length)return w.sets.filter(s=>s.w||s.r).map(s=>({w:s.w,r:s.r}));
  }
  return [];
}
function lastPerf(exId){
  for(let i=S.history.length-1;i>=0;i--){
    const e=(S.history[i].exercises||[]).find(x=>x.exId===exId);
    if(!e)continue;
    const good=e.sets.filter(s=>+s.w>0&&+s.r>0);
    if(good.length){
      const w=Math.max(...good.map(s=>+s.w));
      const tops=good.filter(s=>+s.w===w);
      const r=Math.max(...tops.map(s=>+s.r));
      const rt=tops.find(s=>s.rir!==undefined&&s.rir!==null&&s.rir!=="");
      return {w,r,rir:rt?(+rt.rir):null};
    }
  }
  return null;
}
function suggestNext(exId){
  if(screeningFailed())return "";
  const lib=exById(exId);const tgt=lib?defRir(lib):1;
  const sess=exSessions(exId);
  const L=S.history.slice(-2);
  const badRecov=L.length===2&&L.every(h=>h.checkin&&(h.checkin.sore>=2||h.checkin.joint));
  if(badRecov)return "پیشنهاد: امروز حفظ حجم — ریکاوری اول";
  if(sess.length<2)return "شروع با RIR "+tgt+" — بعد از ۲ جلسهٔ قابل‌مقایسه پیشنهاد می‌دهم";
  const p=lastPerf(exId);if(!p)return "";
  const prevTop=(sess[sess.length-2].exercises||[]).find(x=>x.exId===exId);
  const prevGood=prevTop?prevTop.sets.filter(s=>+s.w>0&&+s.r>0):[];
  const prevW=prevGood.length?Math.max(...prevGood.map(s=>+s.w)):null;
  if(prevW&&Math.abs(p.w-prevW)/prevW>0.1)return "برای مقایسهٔ منصفانه، "+prevW+" کگ را تکرار کن";
  const pre="پیشنهاد: ";
  if(p.rir===null)return pre+"همان "+p.w+" کگ — این جلسه RIR ثبت کن";
  if(p.rir>tgt+1)return pre+p.w+" کگ × "+(p.r+2)+" (سبک‌تر از هدف بود)";
  if(p.rir<tgt-1)return pre+p.w+" کگ × "+Math.max(1,p.r-1)+" (سنگین‌تر از هدف بود)";
  if(p.r<12)return pre+p.w+" کگ × "+(p.r+1)+" تکرار";
  const nw=Math.round((p.w*1.05)*2)/2;
  return pre+nw+" کگ × "+Math.max(6,p.r-3)+" تکرار";
}
function screeningFailed(){return !!(S.screening&&S.screening.done&&S.screening.passed===false);}
function exSessions(exId){
  return S.history.filter(h=>(h.exercises||[]).some(e=>e.exId===exId));
}
function isPlateaued(exId){
  const arr=exSessions(exId).slice(-3).map(h=>{
    let m=0;(h.exercises||[]).filter(e=>e.exId===exId).forEach(e=>e.sets.forEach(s=>{if(+s.w>0&&+s.r>0)m=Math.max(m,e1rm(+s.w,+s.r));}));
    return m;
  });
  if(arr.length<3||arr.some(v=>!v))return false;
  const chg=(arr[2]-arr[0])/arr[0];
  return chg<0.01&&chg>-0.01;
}
function deloadFlagged(){
  const L=S.history.slice(-2);
  return L.length===2&&L.every(h=>h.checkin&&(h.checkin.sore>=2||h.checkin.joint));
}
function inManualDeload(){
  return !!(S.manualDeload&&today()<=S.manualDeload);
}
function autoTune(){
  if(S.lastTune===today())return;
  if(S.history.length<6){S.lastTune=today();save();return;}
  const proposals=[];
  MKORDER.forEach(k=>{
    const all=S.history.filter(h=>(h.exercises||[]).some(e=>{const l=exById(e.exId);return l&&l.mk===k;}));
    const recent=all.slice(-4);
    if(recent.length<4)return;
    let soreHits=0;
    all.slice(-3).forEach(h=>{if(h.checkin&&h.checkin.sore>=2)soreHits++;});
    const bests=recent.map(h=>{let m=0;(h.exercises||[]).forEach(e=>{const l=exById(e.exId);if(l&&l.mk===k)e.sets.forEach(s=>{if(+s.w>0&&+s.r>0)m=Math.max(m,e1rm(+s.w,+s.r));});});return m;});
    const grew=bests[3]>bests[0]*1.02,fell=bests[3]<bests[0]*0.98;
    const t=S.volumeTargets[k];
    const jointHit=all.slice(-3).some(h=>h.checkin&&h.checkin.joint&&Array.isArray(h.checkin.jointAreas)&&h.checkin.jointAreas.includes(k));
    if(soreHits>=2&&t>4)proposals.push({k,delta:-1,reason:"کوفتگی تکراری"});
    else if(jointHit&&fell&&t>6)proposals.push({k,delta:-1,reason:"درد مفصل همان ناحیه"});
    else if(!grew&&!fell&&soreHits===0&&t<26)proposals.push({k,delta:1,reason:"بدون پیشرفت و بدون کوفتگی"});
  });
  S.lastTune=today();
  if(proposals.length)S.pendingTune={date:today(),items:proposals};
  save();
}

function mesoInfo(){
  if(!S.meso)return null;
  const start=new Date(S.meso.start+"T00:00:00");
  const days=Math.floor((Date.now()-start.getTime())/86400000)+1;
  const week=Math.min(S.meso.weeks,Math.ceil(days/7));
  return {week,days,done:days>S.meso.weeks*7,...S.meso};
}
function isDeloadWeek(){const m=mesoInfo();return !!(m&&m.week===1&&m.deloadFirst)||inManualDeload();}

function weekSets(){
  const out={};MKORDER.forEach(k=>out[k]=0);
  const cutoff=daysAgoKey(7);
  S.history.forEach(h=>{
    if(entryDay(h)<cutoff)return;
    (h.exercises||[]).forEach(e=>{
      const lib=exById(e.exId);if(!lib)return;
      const n=(e.sets||[]).filter(s=>s.w||s.r).length;
      if(n){out[lib.mk]=(out[lib.mk]||0)+n;(lib.sec||[]).forEach(m=>out[m]=(out[m]||0)+n*0.5);}
    });
  });
  Object.keys(out).forEach(k=>out[k]=Math.round(out[k]*10)/10);
  return out;
}
function totalVolLastDays(days){
  const cutoff=Date.now()-days*86400000;
  return S.history.filter(h=>new Date(h.date).getTime()>=cutoff).reduce((a,h)=>a+(h.volume||volOf(h)),0);
}
function acwr(){
  const cur=totalVolLastDays(7);
  const prev=(totalVolLastDays(28)-cur)/3;
  if(prev<500)return null;
  return Math.round(cur/Math.max(prev,1)*100)/100;
}

function startSession(dayId,dayName,exList,deload){
  if(S.activeSession){setTab("workout");toast("جلسه فعال در جریان است — ادامه بده");return;}
  const red=(S.readiness&&S.readiness[today()]&&S.readiness[today()].sleep<=1);
  const soft=deload||inManualDeload();
  S.activeSession={
    dayId,dayName,startedAt:new Date().toISOString(),
    deload:!!deload,red:red,
    exercises:exList.map(([idRaw,baseSets])=>{
      const id=(S.swaps&&S.swaps[idRaw])||idRaw;
      const lib=exById(id);const prev=lastSetsFor(id);
      let tgt=soft||red?Math.max(2,Math.round(baseSets*(deload?0.5:0.75))):baseSets;
      let sets=prev.length?prev.slice(0,Math.max(tgt,Math.min(prev.length,tgt+1))):[];
      while(sets.length<tgt)sets.push({w:"",r:""});
      return {exId:id,name:lib.n,cls:lib.cls,target:tgt,
        sets:sets.map(s=>({w:s.w,r:s.r,done:false}))};
    })
  };
  save();setTab("workout");
}

function mesoSessions(){
  if(!S.meso)return[];
  return S.history.filter(h=>entryDay(h)>=S.meso.start);
}
function trendsFor(){
  const sess=mesoSessessions();
  const agg={};
  sess.forEach(h=>(h.exercises||[]).forEach(e=>{
    const best=e.sets.filter(s=>+s.w>0&&+s.r>0).map(s=>e1rm(+s.w,+s.r));
    if(!best.length)return;
    (agg[e.exId]=agg[e.exId]||[]).push(Math.max(...best));
  }));
  const out=[];
  Object.keys(agg).forEach(id=>{
    const arr=agg[id];if(arr.length<2)return;
    const half=Math.floor(arr.length/2);
    const f=Math.max(...arr.slice(0,half)),l=Math.max(...arr.slice(half));
    const chg=f?Math.round((l-f)/f*1000)/10:0;
    out.push({name:(exById(id)||{}).n||id,mk:(exById(id)||{}).mk||"",first:Math.round(f),last:Math.round(l),
      dir:chg>1.5?"up":chg<-1.5?"down":"flat"});
  });
  return out;
}
function mesoSessessions(){return mesoSessions();}

    <label class="btn ghost" style="display:block;text-align:center;margin-top:8px;cursor:pointer">بازیابی از فایل<input type="file" id="import-file" accept=".json" style="display:none"></label>
    <button class="btn danger" style="margin-top:8px" data-act="wipe">پاک کردن همه داده‌ها</button>
  </div>
  <div class="card">
    <h2>درباره</h2>
    <p class="mut">نسخهٔ ۲٫۱ · مبتنی بر ۲۳ سند علمی تدوین‌شده از Renaissance Periodization، Flow High Performance و Huberman/Galpin · آخرین بازبینی شواهد: ۲۰۲۶-۰۸-۲۴ · <a href="https://raw.githubusercontent.com/najiballahhaqmal568-hub/myboybuildingrepo/main/KNOWLEDGE.md" target="_blank" rel="noopener" style="color:var(--blue)">کتابخانهٔ دانش (KNOWLEDGE.md)</a> · سیاست‌ها: <a href="https://raw.githubusercontent.com/najiballahhaqmal568-hub/myboybuildingrepo/main/POLICY.md" target="_blank" rel="noopener" style="color:var(--blue)">POLICY.md</a></p>
    <p class="mut" style="margin-top:6px">داده‌ها فقط روی همین دستگاه ذخیره می‌شوند (localStorage). «نشانگر تغییر بار» صرفاً راهنمای افزایش تدریجی است. این اپ مشاور پزشکی نیست — دامنه و مرزها در اولین اجرا پذیرفته شده‌اند.</p>
  </div>`;

document.addEventListener("click",ev=>{
  const nb=ev.target.closest("[data-tab]");
  if(nb){setTab(nb.dataset.tab);return;}
  const el=ev.target.closest("[data-act]");
  if(!el)return;
  const act=el.dataset.act;
  const s=S.activeSession;

  if(act==="toggle-set"){
    const i=+el.dataset.i,j=+el.dataset.j,row=el.closest("tr");
    const g=r=>row.querySelector(`[data-role="${r}"]`);
    s.exercises[i].sets[j]={w:g("w").value,r:g("r").value,rir:S.settings.rir?(g("rir")?g("rir").value:""):"",done:!s.exercises[i].sets[j].done};
    save();render();
    if(s.exercises[i].sets[j].done)startRest(90);
    return;
  }
  if(act==="add-set"){
    const i=+el.dataset.i,st=s.exercises[i].sets,last=st[st.length-1];
    st.push({w:last?last.w:"",r:last?last.r:"",done:false});
    save();render();return;
  }
  if(act==="del-exercise"){s.exercises.splice(+el.dataset.i,1);save();render();return;}
  if(act==="add-exercise"){ui.pickerTarget="session";openModal(pickerEx());return;}
  if(act==="tune-accept"){
    const pt=S.pendingTune;if(!pt)return;
    const changes=[];
    pt.items.forEach(it=>{S.volumeTargets[it.k]=clampTgt(it.k,(S.volumeTargets[it.k]||DEF_TGT[it.k])+it.delta);changes.push(MK[it.k]+" "+(it.delta>0?"+۱":"−۱"));});
    S.tuneLog=(S.tuneLog||[]).concat([{date:today(),conf:"low",changes:changes}]).slice(-12);
    delete S.pendingTune;save();render();toast("اعمال شد");return;
  }
  if(act==="tune-reject"){delete S.pendingTune;save();render();toast("رد شد — هدف‌ها دست‌نخورده");return;}
  if(act==="ack-scope"){S.disclaimerSeen=true;save();render();return;}
  if(act==="scr-set"){
    ui.scr=ui.scr||{};
    ui.scr[el.dataset.i]=el.dataset.v;
    render();return;
  }
  if(act==="scr-save"){
    const scr=ui.scr||{};
    const vals=Object.values(scr);
    if(vals.length<6){toast("همهٔ ۶ سؤال را جواب بده");return;}
    const passed=!vals.includes("y");
    S.screening={done:true,passed:passed,ts:new Date().toISOString()};
    ui.scr={};
    save();render();
    toast(passed?"غربالگری سبز — پیشنهادها فعال":"زرد: پیشنهادهای شخصی خاموش — با متخصص مشورت کن");
    return;
  }
  if(act==="scr-reset"){S.screening={done:false,passed:false,ts:new Date().toISOString()};ui.scr={};save();render();return;}
  if(act==="set-sleep"){
    S.readiness=S.readiness||{};
    S.readiness[today()]={sleep:+el.dataset.v};
    save();render();
    if(+el.dataset.v<=1)toast("روز بازیابی — امروز ملایم‌تر تمرین کن");
    return;
  }
  if(act==="start-deload"){
    const d=new Date();d.setDate(d.getDate()+7);
    S.manualDeload=today(d);
    save();render();toast("دلود ۷ روزه فعال شد — ست‌ها نصف");return;
  }
  if(act==="swap-start"){
    ui.pickerTarget="swap:"+el.dataset.id;
    const lib=exById(el.dataset.id);
    openModal(`<h2>تعویض ${$esc(lib.n)}</h2><p class="mut" style="margin-bottom:10px">حرکت هم‌عضله را انتخاب کن (فلات را بشکن):</p><div id="ex-list">${exListFiltered(lib.mk,lib.id,"")}</div>`);
    return;
  }
  if(act==="ex-info"){
    const lib=exById(s.exercises[+el.dataset.i].exId);if(!lib)return;
    const yt=lib.vid?VIDBASE+lib.vid:"https://www.youtube.com/results?search_query="+encodeURIComponent(lib.n+" فرم صحیح");
    const pat=EXANIM[lib.id]||"press_h";
    openModal(`<h2>${$esc(lib.n)}</h2>
    <svg id="exanim" data-pattern="${pat}" viewBox="0 0 120 112" style="width:100%;height:170px;background:var(--card2);border-radius:12px;margin-bottom:6px"></svg>
    <div class="row" style="justify-content:center;margin-bottom:8px"><span class="chip on">${CLSN[lib.cls]}</span><span class="chip">${$esc(lib.eq)}</span></div>
    <p style="margin-bottom:14px">${$esc(lib.how)}</p>
    <a class="btn ghost" style="text-decoration:none;display:block;text-align:center" href="${yt}" target="_blank" rel="noopener">ویدیوی کامل یوتیوب</a>
    <button class="btn" style="margin-top:8px" data-act="close-modal">بستن</button>`);
    startAnim(document.getElementById("exanim"));return;
  }
  if(act==="finish"){finishWorkout();return;}
  if(act==="discard"){if(confirm("تمرین فعلی حذف شود؟")){S.activeSession=null;save();render();}return;}

  if(act==="start-day"){const p=PROGRAM.find(x=>x.id===el.dataset.id);startSession(p.id,p.name,p.ex,isDeloadWeek());return;}
  if(act==="start-suggested"){const p=nextDay();startSession(p.id,p.name,p.ex,isDeloadWeek());return;}
  if(act==="pick-day"){
    openModal(`<h2>انتخاب روز</h2>${PROGRAM.map(p=>`<button class="btn ghost" style="margin-top:8px;text-align:right" data-act="start-day" data-id="${p.id}">${$esc(p.name)}</button>`).join("")}
    <button class="btn" style="margin-top:8px" data-act="start-free">تمرین آزاد</button>`);return;
  }
  if(act==="start-free"){ui.pickerTarget="free";ui.free=[];openModal(pickerEx());return;}
  if(act==="choose-ex"){
    if(ui.pickerTarget&&ui.pickerTarget.indexOf("swap:")===0){
      const oldId=ui.pickerTarget.slice(5);
      S.swaps=S.swaps||{};
      S.swaps[oldId]=el.dataset.id;
      save();closeModal();render();
      toast("تعویض شد — از جلسه بعد اعمال می‌شود");
      return;
    }
    if(ui.pickerTarget==="free"){
      ui.free=ui.free||[];
      if(!ui.free.includes(el.dataset.id)){ui.free.push(el.dataset.id);el.textContent="✓ شد";el.classList.add("on");}
      return;
    }
    closeModal();
    if(s){
      const id=el.dataset.id,lib=exById(id),prev=lastSetsFor(id);
      s.exercises.push({exId:id,name:lib.n,cls:lib.cls,target:3,
        sets:(prev.length?prev.slice(0,3):[{w:"",r:""}]).map(x=>({w:x.w,r:x.r,done:false}))});
      save();render();
    }
    return;
  }

  if(act==="start-meso"){
    const w=Math.max(3,Math.min(8,+$("#meso-weeks").value||4));
    S.meso={start:$("#meso-start").value||today(),weeks:w,deloadFirst:true};
    save();render();toast("مسوسیکل شروع شد — هفته اول دلود");return;
  }
  if(act==="open-review"){ui.reviewStep=1;ui.reviewData={adj:{}};setTab("meso");return;}
  if(act==="end-meso-early"){ui.reviewStep=1;ui.reviewData={adj:{}};render();return;}
  if(act==="rev-set"){ui.reviewData.adj[el.dataset.k]=el.dataset.v;render();
    const mb=$("#modal-bg");/*re-render main behind*/return;}
  if(act==="rev-sys"){ui.reviewData.sys=el.dataset.v;render();return;}
  if(act==="rev-next"){ui.reviewStep++;render();window.scrollTo(0,0);return;}
  if(act==="rev-apply"){
    Object.keys(ui.reviewData.adj||{}).forEach(k=>{
      const v=ui.reviewData.adj[k];
      const delta=v==="down"?2:v==="up"?1:v==="pain"?-2:0;
      S.volumeTargets[k]=clampTgt(k,(S.volumeTargets[k]||DEF_TGT[k])+delta);
    });
    if(ui.reviewData.sys==="tired"){
      Object.keys(S.volumeTargets).forEach(k=>{S.volumeTargets[k]=Math.max(2,Math.round(S.volumeTargets[k]*0.9));});
    }
    S.meso={start:today(),weeks:S.meso?S.meso.weeks:4,deloadFirst:true};
    ui.reviewStep=0;
    save();render();toast("بلوک جدید — هفته اول دلود");return;
  }

  if(act==="log-weight"){
    openModal(`<h2>ثبت وزن بدن</h2><div class="row">
      <input type="number" step="0.1" id="bw-modal" inputmode="decimal" placeholder="کیلوگرم">
      <button class="btn" style="min-width:100px" data-act="save-bw-modal">ثبت</button></div>`);
    setTimeout(()=>{const i=$("#bw-modal");if(i)i.focus();},50);return;
  }
  if(act==="save-bw-modal"){doSaveWeight($("#bw-modal").value);closeModal();return;}
  if(act==="save-bw"){doSaveWeight($("#bw-in").value);return;}
  if(act==="toggle-rir"){S.settings.rir=!S.settings.rir;save();render();return;}
  if(act==="export"){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="gymlog2-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);return;
  }
  if(act==="wipe"){if(confirm("همه داده‌ها پاک شوند؟")){localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY);S=loadState();render();toast("پاک شد");}return;}
  if(act==="close-modal"){closeModal();return;}
  if(act==="go-workout"){setTab("workout");return;}
  if(act==="timer-skip"){endRest(false);return;}
  if(act==="timer-plus"){ui.rest+=15;return;}
  if(act==="timer-minus"){ui.rest=Math.max(0,ui.rest-15);return;}
});

document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.tgt){S.volumeTargets[el.dataset.tgt]=clampTgt(el.dataset.tgt,+el.value||DEF_TGT[el.dataset.tgt]);save();return;}
  if(el.id==="import-file"&&el.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{
      const d=JSON.parse(fr.result);
      if(!d.history||!d.version)throw 0;
      S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d);
      save();render();toast("بازیابی شد");
    }catch(e){toast("فایل نامعتبر است");}};
    fr.readAsText(el.files[0]);return;
  }
  if(["w","r","rir"].includes(el.dataset.role)){
    const s=S.activeSession;
    if(s){
      const st=s.exercises[+el.dataset.i].sets[+el.dataset.j];
      st[el.dataset.role]=el.dataset.role==="rir"?(el.value===""?"":+el.value):el.value;
    }
    save();
  }
});

function exListFiltered(mk,excludeId,q){
  const es=LIB.filter(e=>e.mk===mk&&e.id!==excludeId&&(!q||e.n.includes(q)||(e.eq||"").includes(q)));
  return es.map(e=>`<div class="li"><b>${$esc(e.n)}</b><button class="btn sm" data-act="choose-ex" data-id="${e.id}">این را بگذار</button></div>`).join("")||`<p class="empty">گزینه‌ای نیست.</p>`;
}
function pickerEx(){
  const groups={};LIB.forEach(e=>{(groups[MK[e.mk]]=groups[MK[e.mk]]||[]).push(e)});
  let html=`<h2>انتخاب حرکت</h2><input type="text" id="ex-search" placeholder="جستجو…" style="margin-bottom:10px"><div id="ex-list">`;
  Object.keys(groups).forEach(g=>{
    html+=`<div class="mut" style="margin:10px 0 2px">${g}</div>`+groups[g].map(e=>
      `<div class="li"><b>${$esc(e.n)}</b><button class="btn sm" data-act="choose-ex" data-id="${e.id}">افزودن</button></div>`).join("");
  });
  return html+`</div>`;
}

document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="meso-start"){const f=$("#meso-start-fa");if(f)f.textContent="شروع: "+fmtDate(el.value);return;}
  if(el.id==="ex-search"){
    const q=el.value.trim();
    let html="";
    if(ui.pickerTarget&&ui.pickerTarget.indexOf("swap:")===0){
      const oldId=ui.pickerTarget.slice(5);
      const lib=exById(oldId);
      html=exListFiltered(lib?lib.mk:"back",oldId,q);
    }else{
      const groups={};LIB.forEach(e=>{(groups[MK[e.mk]]=groups[MK[e.mk]]||[]).push(e)});
      Object.keys(groups).forEach(g=>{
        const es=groups[g].filter(e=>!q||e.n.includes(q)||g.includes(q)||(e.eq||"").includes(q));
        if(es.length)html+=`<div class="mut" style="margin:10px 0 2px">${g}</div>`+es.map(e=>
          `<div class="li"><b>${$esc(e.n)}</b><button class="btn sm" data-act="choose-ex" data-id="${e.id}">افزودن</button></div>`).join("");
      });
    }
    $("#ex-list").innerHTML=html||`<p class="empty">پیدا نشد.</p>`;
  }
});
document.getElementById("modal-bg").addEventListener("click",ev=>{if(ev.target.id==="modal-bg")closeModal();});

function startRest(sec){
  clearInterval(ui.timerInt);ui.rest=sec;
  const tb=$("#timerbar");tb.classList.add("open");
  const tick=()=>{
    if(ui.rest==null){tb.classList.remove("open");return;}
    const m=Math.floor(ui.rest/60),s=ui.rest%60;
    $("#timer-num").textContent=m+":"+String(s).padStart(2,"0");
    if(ui.rest<=0)endRest(true);
    ui.rest--;
  };
  tick();ui.timerInt=setInterval(tick,1000);
}
function endRest(done){
  clearInterval(ui.timerInt);
  $("#timerbar").classList.remove("open");
  if(done&&navigator.vibrate)navigator.vibrate([200,100,200]);
  ui.rest=null;
}

function finishWorkout(){
  const s=S.activeSession;if(!s)return;
  const used=s.exercises.filter(e=>e.sets.some(st=>st.w||st.r));
  if(!used.length){toast("هیچ ست‌ای ثبت نشده!");return;}
  used.forEach(e=>{
    const best=e.sets.filter(st=>+st.w>0&&+st.r>0).sort((a,b)=>e1rm(+b.w,+b.r)-e1rm(+a.w,+a.r))[0];
    if(best){const p=S.prs[e.exId];
      if(!p||e1rm(+best.w,+best.r)>e1rm(p.w,p.r))S.prs[e.exId]={w:+best.w,r:+best.r,date:today()};}
  });
  const mins=Math.max(1,Math.round((Date.now()-new Date(s.startedAt).getTime())/60000));
  S.history.push({
    date:new Date().toISOString(),
    day:localDateKey(s.startedAt),
    dayId:s.dayId,dayName:s.dayName,durationMin:mins,deload:!!s.deload,
    exercises:used.map(e=>({exId:e.exId,name:e.name,
      sets:e.sets.filter(st=>st.w||st.r).map(st=>({w:+st.w||"",r:+st.r,rir:st.rir===""||st.rir==null?undefined:+st.rir}))})),
    volume:volOf(s)
  });
  S.activeSession=null;save();endRest(false);
  openModal(`<h2>چک-این سریع</h2>
  <p class="mut" style="margin-bottom:8px">کوفتگی عضلانی امروز (۰ = هیچ، ۳ = شدید):</p>
  <div class="row" id="ci-sore">${[0,1,2,3].map(v=>`<button class="chip ${v===0?"on":""}" data-ci-sore="${v}" style="flex:1;text-align:center">${v}</button>`).join("")}</div>
  <div class="spread" style="margin:14px 0"><b>درد مفصل داشتی؟</b><button class="chip" data-ci-joint>نه</button></div>
  <div id="ci-areas" style="display:none;margin-bottom:10px"><span class="mut">کدام ناحیه؟</span><div class="row" style="flex-wrap:wrap;margin-top:6px">${MKORDER.map(k=>`<button class="chip" data-ci-area="${k}" style="font-size:11.5px">${MK[k]}</button>`).join("")}</div></div>
  <button class="btn"data-act="ci-save">ذخیره جلسه</button>`);
  let sore=0,joint=false,jointArea=null;
  $("#modal").querySelectorAll("[data-ci-sore]").forEach(b=>b.addEventListener("click",()=>{
    sore=+b.dataset.ciSore;
    $("#modal").querySelectorAll("[data-ci-sore]").forEach(x=>x.classList.toggle("on",x===b));
  }));
  const jb=$("#modal").querySelector("[data-ci-joint]");
  const areasWrap=$("#modal").querySelector("#ci-areas");
  jb.addEventListener("click",()=>{
    joint=!joint;jb.classList.toggle("on",joint);jb.textContent=joint?"بله":"نه";
    areasWrap.style.display=joint?"block":"none";
    if(!joint){jointArea=null;areasWrap.querySelectorAll("[data-ci-area]").forEach(x=>x.classList.remove("on"));}
  });
  areasWrap.querySelectorAll("[data-ci-area]").forEach(b=>b.addEventListener("click",()=>{
    jointArea=b.dataset.ciArea;
    areasWrap.querySelectorAll("[data-ci-area]").forEach(x=>x.classList.toggle("on",x===b));
  }));
  $("#modal").querySelector("[data-act='ci-save']").addEventListener("click",()=>{
    S.history[S.history.length-1].checkin={sore,joint,jointAreas:joint&&jointArea?[jointArea]:[]};save();closeModal();
    setTab("volume");toast("ذخیره شد 💪");
    const flags=[];
    S.history.slice(-3).forEach(h=>{const c=h.checkin;if(c&&c.sore>=2)flags.push("کوفتگی");if(c&&c.joint)flags.push("درد مفصل");});
    if(flags.length>=2)setTimeout(()=>toast("⚠️ چند جلسه اخیر علائم داشت — به بازنگری مسوسیکل سر بزن"),1200);
  });
}
function doSaveWeight(v){
  const kg=parseFloat(v);
  if(!kg){toast("عدد معتبر وارد کن");return;}
  S.weights=(S.weights||[]).filter(w=>w.date!==today());
  S.weights.push({date:today(),kg});
  S.weights.sort((a,b)=>a.date<b.date?-1:1);
  save();render();toast("وزن ثبت شد");
}

(function(){
  const m=(location.hash||"").match(/^#tab-(\w+)/);
  const q=(location.search||"").match(/[?&]tab=(\w+)/);
  const t=(m&&m[1])||(q&&q[1]);
  if(t&&["home","workout","volume","meso","history","settings"].includes(t))ui.tab=t;
})();
window.addEventListener("hashchange",()=>{
  const m=(location.hash||"").match(/^#tab-(\w+)/);
  const t=m&&["home","workout","volume","meso","history","settings"].includes(m[1])?m[1]:null;
  if(t&&t!==ui.tab){ui.tab=t;render();}
});
window.__GL={
 today,localDateKey,entryDay,faNum,
 tab:()=>ui.tab,hash:()=>location.hash,
 main:()=>document.querySelector("#main").innerHTML,
 state:()=>S,
 start:(id)=>{const p=PROGRAM.find(x=>x.id===id)||PROGRAM[0];startSession(p.id,p.name,p.ex,isDeloadWeek());},
 finish:()=>finishWorkout(),
 rirDefault:(id)=>defRir(exById(id)),
 importJSON:(txt)=>{try{const d=JSON.parse(txt);if(!d.history||!d.version)throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d);save();render();return true;}catch(e){return false;}},
 exportJSON:()=>JSON.stringify(S),
 migrateProbe:(o)=>{const m=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),o);return{version:m.version,historyLen:(m.history||[]).length,hasTargets:!!m.volumeTargets,keptOldHistory:(m.history||[]).length};},
 suggest:(id)=>suggestNext(id),
 go:(t)=>setTab(t),
 ackScope:()=>{S.disclaimerSeen=true;save();}
};
try{autoTune();}catch(e){}
render();
</script>
